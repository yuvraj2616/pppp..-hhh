name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "true"
      STORAGE_DIR: /tmp/storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install light dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check .

      - name: Tests (mock LLM)
        run: pytest -q

      - name: Validate synthetic data (once it exists)
        run: |
          if [ -f data/synthetic/students.csv ]; then
            python scripts/validate_students.py --dir data/synthetic
          else
            echo "No synthetic data yet - skipping"
          fi
