[project]
name = "student-assistant"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["storage", "data"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008"]  # FastAPI uses calls in defaults (File(...), Header(...))

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
